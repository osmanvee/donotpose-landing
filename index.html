<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DoNotPose — unposed street interviews showcasing local artists and their work."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DoNotPose™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <img
          class="hero__bg"
          src="assets/main-background.JPG"
          alt=""
        />
        <div class="hero__gradient" aria-hidden="true"></div>
        <div class="hero__content">
          <h1 class="logo" id="hero-title">
            <img
              src="assets/donotpose-logo-white.svg"
              alt="DoNotPose"
              width="801"
              height="183"
            />
          </h1>
          <p class="manifesto">
            A series of unposed street interviews, showcasing local artists and
            their work, by
            <a
              href="https://www.instagram.com/osmanwarsi/"
              target="_blank"
              rel="noreferrer"
              >Osman</a
            >.
          </p>
          <a
            class="instagram"
            href="https://www.instagram.com/donotpose/"
            target="_blank"
            rel="noreferrer"
            aria-label="Follow DoNotPose on Instagram"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle class="instagram__dot" cx="17.4" cy="6.7" r="1"></circle>
            </svg>
            <span>Follow the process</span>
          </a>
        </div>

        <a class="scroll-cue" href="#stories">
          <span>Interviews</span>
          <span aria-hidden="true">↓</span>
        </a>
      </section>

      <section class="stories" id="stories" aria-label="Interviews">
        <div class="story-grid" id="story-grid"></div>
      </section>
    </main>

    <footer>
      <span>DoNotPose™</span>
    </footer>

    <script src="work/pieces.js"></script>
    <script src="work/load-work.js"></script>
  </body>
</html>
