<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DoNotPose — unposed street interviews showcasing local artists and their work."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DoNotPose™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preload" as="image" href="assets/main-background-opt.jpg" />
  </head>
  <body>
    <header class="site-header site-header--home">
      <a
        class="contact-btn"
        href="https://form.typeform.com/to/Ouv8cyXo"
        target="_blank"
        rel="noreferrer"
      >
        Contact
      </a>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <img
          class="hero__bg"
          src="assets/main-background-opt.jpg"
          alt=""
          width="1920"
          height="1080"
          fetchpriority="high"
          decoding="async"
        />
        <div class="hero__gradient" aria-hidden="true"></div>
        <div class="hero__content">
          <h1 class="logo" id="hero-title">
            <img
              src="assets/donotpose-logo-white.svg"
              alt="DoNotPose"
              width="801"
              height="183"
            />
          </h1>
          <p class="manifesto">
            A series of unposed street interviews, showcasing local artists and
            their work. Produced by
            <a
              href="https://www.instagram.com/osmanwarsi/"
              target="_blank"
              rel="noreferrer"
              >Osman</a
            >.
          </p>

          <p class="hero__note">No use of AI in the video editing process.</p>
          <a
            class="contact-btn"
            href="https://www.instagram.com/donotpose/"
            target="_blank"
            rel="noreferrer"
            aria-label="Check out DoNotPose on Instagram"
          >
            Check it out:
          </a>
        </div>

        <a class="scroll-cue" href="#stories">
          <span>Interviews</span>
          <span aria-hidden="true">↓</span>
        </a>
      </section>

      <section class="stories" id="stories" aria-label="Interviews">
        <div class="story-grid" id="story-grid"></div>
      </section>
    </main>

    <footer>
      <span>DoNotPose™</span>
    </footer>

    <script src="work/pieces.js"></script>
    <script src="work/load-work.js"></script>
  </body>
</html>
